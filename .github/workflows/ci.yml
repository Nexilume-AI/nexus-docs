name: Isolated docs PR compatibility validation
on:
  push:
    branches: [codex/validate-docs-upgrades-20260920]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-pages-pr3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 652da8a2ad91a7078974e8d1fcdafa6a82506e7d
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = 652da8a2ad91a7078974e8d1fcdafa6a82506e7d
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check:docs
      - run: npm run check:security
      - run: npm run check:audit
      - run: npm run build
        env:
          DOCS_URL: ${{ vars.DOCS_URL || format('https://{0}.github.io', github.repository_owner) }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || format('/{0}/', github.event.repository.name) }}
      - name: Verify PR3 selects the action being exercised
        run: grep -F 'actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9' .github/workflows/pages.yml
      - name: Upload real bilingual Pages artifact without deployment
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build
          retention-days: '1'
      - name: Verify artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "PR3 artifact ID: $ARTIFACT_ID"
  deploy-pages-pr5-unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 71a3f5af441bcbf05b3443f7ae70efe39a3cfff0
          path: docs-config
          persist-credentials: false
      - run: test "$(git -C docs-config rev-parse HEAD)" = 71a3f5af441bcbf05b3443f7ae70efe39a3cfff0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: actions/deploy-pages
          ref: 368f82528645a54fb793d4d04e342629a3f51346
          path: deploy-action
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: deploy-action
      - name: Verify PR5 workflow and action contract
        working-directory: deploy-action
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const yaml = require('js-yaml');
          const w = yaml.load(fs.readFileSync('../docs-config/.github/workflows/pages.yml', 'utf8'));
          const a = yaml.load(fs.readFileSync('action.yml', 'utf8'));
          assert.equal(w.on, 'workflow_dispatch');
          assert.equal(w.jobs.deploy.needs, 'build');
          assert.equal(w.jobs.deploy.permissions.pages, 'write');
          assert.equal(w.jobs.deploy.permissions['id-token'], 'write');
          assert.equal(w.jobs.deploy.environment.name, 'github-pages');
          assert.equal(w.jobs.deploy.steps[0].uses, 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346');
          assert.equal(w.jobs.build.steps.find(s => s.uses?.startsWith('actions/upload-pages-artifact@')).with.path, 'build');
          assert.equal(a.inputs.artifact_name.default, 'github-pages');
          assert.equal(a.runs.using, 'node24');
          assert.ok(a.outputs.page_url);
          console.log('PR5 Pages workflow/action contracts match. No deployment requested.');
          NODE
      - name: Run official action unit tests with mocked deployment APIs
        working-directory: deploy-action
        run: npm test -- --runInBand
  typescript-pr7-reproduce-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c342efcc35485203fd63c129c3446ec1e0217975
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = c342efcc35485203fd63c129c3446ec1e0217975
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Confirm exact TypeScript version
        run: npx --no-install tsc --version
      - name: Reproduce unsupported baseUrl configuration error
        shell: bash
        run: |
          set +e
          npx --no-install tsc --noEmit > tsc-result.log 2>&1
          result=$?
          set -e
          cat tsc-result.log
          test "$result" -ne 0
          grep -E 'baseUrl.*(removed|not supported|unknown)|[Oo]ption.*baseUrl' tsc-result.log
          echo 'Confirmed PR7 fails its actual compiler; failure is expected by this diagnostic job.'
